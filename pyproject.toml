[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plot-erg"
version = "0.2.0"
description = "Visionneuse et export PDF pour enregistrements Intan RHS / ERG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "matplotlib>=3.7,<4",
  "PySide6>=6.5,<7",
  "scipy>=1.10,<2",
  "pyqtgraph>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]

[project.scripts]
plot-erg = "gui.launcher:launch_gui"
intan-trigger-plotter = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "channel_metrics",
  "cli",
  "config",
  "core",
  "dataset_builder",
  "display_config",
  "draw_primitives",
  "erg_cache",
  "impedance_tracking",
  "intan_rhx_dsp",
  "load_intan_rhs_format",
  "memmap_io",
  "panel_catalog",
  "panel_draw_mpl",
  "panel_prepare",
  "panel_registry",
  "pdf_layout",
  "plot_utils",
  "plotting",
  "probe_layout",
  "processed_dataset",
  "view_config",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gui*", "intanutil*"]
