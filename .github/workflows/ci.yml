name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries for Qt offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify channel_metrics is importable from install
        run: python -c "import channel_metrics; print(channel_metrics.__file__)"

      - name: smoke_dataset
        run: python tools/smoke_dataset.py

      - name: smoke_render
        run: python tools/smoke_render.py

      - name: smoke_montage_ylim
        run: python tools/smoke_montage_ylim.py

      - name: smoke_montage_kind
        run: python tools/smoke_montage_kind.py

      - name: smoke_ylim_autoscale
        run: python tools/smoke_ylim_autoscale.py

      - name: smoke_gui (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_gui.py

      - name: smoke_perf (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_perf.py
